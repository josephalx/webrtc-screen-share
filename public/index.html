<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>WebRTC Screen Sharing</title>
    <style>
        :root {
            --bg: #0b0d11;
            --surface: #151922;
            --surface-raised: #1d222d;
            --border: #272d3a;
            --text: #e8ecf4;
            --text-dim: #949db0;
            --accent: #4f7cff;
            --accent-hover: #6b91ff;
            --live: #31c76a;
            --warn: #f0b429;
            --error: #f2545b;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Header ---------- */

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            height: 52px;
            flex: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand svg {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ---------- Status pill ---------- */

        #status {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 11px 5px 9px;
            border-radius: 999px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
        }

        #status::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            flex: none;
        }

        #status[data-state="connecting"] {
            color: var(--warn);
        }

        #status[data-state="connecting"]::before {
            animation: pulse 1.4s ease-in-out infinite;
        }

        #status[data-state="live"] {
            color: var(--live);
        }

        #status[data-state="live"]::before {
            box-shadow: 0 0 0 3px rgba(49, 199, 106, 0.18);
        }

        #status[data-state="error"] {
            color: var(--error);
        }

        @keyframes pulse {
            50% { opacity: 0.25; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

        /* ---------- Buttons ---------- */

        .btn {
            font: inherit;
            font-weight: 500;
            color: var(--text);
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 9px 16px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
        }

        .btn:hover {
            background: #262d3b;
            border-color: #38415280;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12.5px;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* ---------- Toolbar ---------- */

        /* Related actions sit in one bordered group; the buttons inside are flat
           so the group, not each button, carries the outline. */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* A group whose buttons are all hidden would be an empty pill. */
        .btn-group:not(:has(> .tool-btn:not([hidden]))) {
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 2px;
            padding: 3px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .tool-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: inherit;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            background: transparent;
            border: none;
            border-radius: 7px;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .tool-btn svg {
            width: 15px;
            height: 15px;
            flex: none;
            color: var(--text-dim);
            transition: color 0.15s ease;
        }

        .tool-btn:hover {
            background: #2a3140;
        }

        .tool-btn:hover svg {
            color: var(--text);
        }

        .tool-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
            background: transparent;
        }

        /* Brief confirmation after a capture ("Saved", "Copied"). */
        .tool-btn.is-done svg {
            color: var(--live);
        }

        /* ---------- Main stage ---------- */

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: stretch;
            overflow: hidden;
            padding: 16px;
            min-height: 0;
        }

        #startMenu {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }

        .card h1 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .card p {
            margin: 0 0 24px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .actions .btn {
            width: 100%;
            padding: 11px 16px;
        }

        #message {
            margin: 20px 0 0;
            padding: 11px 13px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            background: rgba(242, 84, 91, 0.1);
            border: 1px solid rgba(242, 84, 91, 0.3);
            color: #ffb3b7;
        }

        /* ---------- Video ---------- */

        #stage {
            position: relative;
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* Toggled from script on fullscreenchange, which avoids the prefixed
           :fullscreen selectors that some browsers reject outright. */
        #stage.is-fullscreen {
            background: #000;
        }

        #video {
            display: block;
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            /* Letterbox instead of stretching the captured screen out of shape. */
            object-fit: contain;
            background: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        #stage.is-fullscreen #video {
            border: none;
            border-radius: 0;
        }

        /* Floating controls, only shown while the stage is full screen or popped
           out. A solid dark bar keeps them readable over any picture. */
        .overlay-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(11, 13, 17, 0.82);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0.8;
            transition: opacity 0.15s ease;
        }

        .overlay-controls:hover,
        .overlay-controls:focus-within {
            opacity: 1;
        }

        /* Inside the picture-in-picture window the stage is the whole page. */
        #stage.is-pip {
            height: 100vh;
            background: #000;
        }

        #stage.is-pip #video {
            border: none;
            border-radius: 0;
        }

        #stage.is-pip .overlay-controls {
            top: 8px;
            right: 8px;
        }

        #stage:not(.is-fullscreen):not(.is-pip) .overlay-controls {
            display: none;
        }

        /* ---------- Share bar ---------- */

        #shareBar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            flex: none;
            padding: 12px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        #shareBar .label {
            color: var(--text-dim);
            font-size: 12.5px;
        }

        #shareUrl {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            padding: 6px 11px;
            border-radius: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            user-select: all;
        }

        @media (max-width: 560px) {
            #header {
                height: auto;
                padding: 10px 12px;
                flex-wrap: wrap;
                row-gap: 10px;
            }

            /* Brand and status share the first row; the toolbar takes a full
               row of its own with equal-width buttons, icon above label. */
            .header-right {
                display: contents;
            }

            #status {
                margin-left: auto;
            }

            #header .toolbar {
                order: 1;
                flex-basis: 100%;
            }

            #header .toolbar:not(:has(.tool-btn:not([hidden]))) {
                display: none;
            }

            #header .btn-group {
                flex: 1;
            }

            #header .btn-group .tool-btn {
                flex: 1;
                flex-direction: column;
                gap: 3px;
                padding: 6px 4px;
                font-size: 11.5px;
            }

            #header .btn-group .tool-btn svg {
                width: 18px;
                height: 18px;
            }

            .card {
                padding: 24px;
            }

            #main {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
<header id="header">
    <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <path d="M8 21h8M12 17v4"></path>
        </svg>
        Screen Share
    </div>
    <div class="header-right">
        <div id="status" data-state="idle" role="status" aria-live="polite">Ready</div>
        <button id="unmute" class="btn btn-small btn-primary" hidden>Unmute</button>
        <div class="toolbar">
            <!-- Capture the current frame -->
            <div class="btn-group" role="group" aria-label="Capture">
                <button id="screenshot" class="tool-btn" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <span class="btn-label">Screenshot</span>
                </button>
                <button id="copyImage" class="tool-btn" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span class="btn-label">Copy</span>
                </button>
            </div>
            <!-- Change how the stream is viewed -->
            <div class="btn-group" role="group" aria-label="View">
                <button id="popOut" class="tool-btn" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <rect x="12" y="12" width="7" height="5" rx="1"></rect>
                    </svg>
                    <span class="btn-label">Pop out</span>
                </button>
                <button id="fullscreen" class="tool-btn" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    <span class="btn-label">Full screen</span>
                </button>
            </div>
        </div>
    </div>
</header>

<main id="main">
    <div id="startMenu">
        <div class="card">
            <h1>Share your screen</h1>
            <p>Stream this screen to any device on your network, or watch a stream someone else is sharing.</p>
            <div class="actions">
                <button id="startShare" class="btn btn-primary">Start Sharing</button>
                <button id="watchStream" class="btn">Watch Stream</button>
            </div>
            <p id="message" hidden></p>
        </div>
    </div>
    <!-- Full screen targets this wrapper rather than the video, so the overlay
         controls stay visible on top of the picture. -->
    <div id="stage" hidden>
        <video id="video" autoplay playsinline></video>
        <div class="btn-group overlay-controls" role="group" aria-label="Capture">
            <button id="fsScreenshot" class="tool-btn" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span class="btn-label">Screenshot</span>
            </button>
            <button id="fsCopyImage" class="tool-btn" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span class="btn-label">Copy</span>
            </button>
        </div>
    </div>
</main>

<div id="shareBar" hidden>
    <span class="label">Open on another device:</span>
    <span id="shareUrl"></span>
    <button id="copyUrl" class="btn btn-small">Copy</button>
    <span id="audioNote" class="label" hidden>
        No audio is being shared. Use Chrome or Edge, share a tab, and tick "Share tab audio".
        Safari and Firefox cannot share audio.
    </span>
</div>

<!-- Served by our own socket.io, so the page works on a network with no internet
     access and the client can never drift from the server's version. -->
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const peerConnections = {};
    const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    const videoElement = document.getElementById("video");
    const startShareButton = document.getElementById("startShare");
    const watchStreamButton = document.getElementById("watchStream");
    const fullscreenButton = document.getElementById("fullscreen");
    const startMenu = document.getElementById("startMenu");
    const statusElement = document.getElementById("status");
    const messageElement = document.getElementById("message");
    const shareBar = document.getElementById("shareBar");
    const shareUrlElement = document.getElementById("shareUrl");
    const copyUrlButton = document.getElementById("copyUrl");
    const unmuteButton = document.getElementById("unmute");
    const screenshotButton = document.getElementById("screenshot");
    const stageElement = document.getElementById("stage");
    const fsScreenshotButton = document.getElementById("fsScreenshot");
    // Header and full-screen overlay copies, kept in step.
    const screenshotButtons = [screenshotButton, fsScreenshotButton];
    const copyImageButtons = [
        document.getElementById("copyImage"),
        document.getElementById("fsCopyImage")
    ];
    // Writing images to the clipboard is only allowed on secure pages.
    const canCopyImage = window.isSecureContext && !!(navigator.clipboard && navigator.clipboard.write)
        && typeof ClipboardItem !== "undefined";

    if (!canCopyImage) {
        copyImageButtons.forEach(b => {
            b.title = "Copying images needs a secure page (HTTPS or localhost). Use Screenshot to save the frame instead.";
        });
    }

    const popOutButton = document.getElementById("popOut");
    // Document Picture-in-Picture (Chrome/Edge 116+) can host our own HTML,
    // unlike the plain video PiP window, which only has the browser's controls.
    // It only exists on secure pages, so a viewer on http://<LAN IP> falls back
    // to the plain video PiP (no screenshot button) and is told why.
    const canPopOut = "documentPictureInPicture" in window;
    const canBasicPip = !!document.pictureInPictureEnabled;
    let pipWindow = null;

    // Buttons hold an icon, so only their label span is ever rewritten.
    function setLabel(button, text) {
        button.querySelector(".btn-label").textContent = text;
    }

    if (!canPopOut) {
        // Document PiP is desktop-only, so on phones no address or flag helps.
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        // Phones are always basic, so the qualifier would just crowd their toolbar.
        if (!isMobile) setLabel(popOutButton, "Pop out (basic)");
        popOutButton.title = isMobile
            ? "Phones can only pop out the video itself. Use the Screenshot button on the page to capture a frame."
            : window.isSecureContext
                ? "This browser can only pop out the video itself. Use desktop Chrome or Edge 116+ for a Screenshot button in the pop-out window."
                : "Pop-out with a Screenshot button needs a secure page (HTTPS or localhost). On this address only the video can be popped out.";
    }

    // Called when the viewer starts or stops receiving video.
    function setScreenshotAvailable(available) {
        screenshotButtons.forEach(b => { b.hidden = !available; });
        copyImageButtons.forEach(b => { b.hidden = !available; });
        popOutButton.hidden = !(available && (canPopOut || canBasicPip));
    }

    // Short label for the header pill. State drives its colour: idle, connecting,
    // live or error.
    function setStatus(text, state) {
        statusElement.textContent = text;
        statusElement.dataset.state = state || "idle";
    }

    // Longer explanations stay in the card, where there is room to read them.
    function showMessage(text) {
        messageElement.textContent = text;
        messageElement.hidden = !text;
    }

    function showStage() {
        startMenu.hidden = true;
        stageElement.hidden = false;
        fullscreenButton.hidden = false;
    }

    function showMenu() {
        startMenu.hidden = false;
        stageElement.hidden = true;
        fullscreenButton.hidden = true;
        unmuteButton.hidden = true;
        setScreenshotAvailable(false);
        if (pipWindow) pipWindow.close();
        shareBar.hidden = true;
        setControlsBusy(false);
    }

    // Both entry points register socket listeners, so a second click would stack
    // a duplicate set and each offer would then be handled twice on the same
    // connection. Lock the controls once a mode is chosen.
    function setControlsBusy(busy) {
        startShareButton.disabled = busy;
        watchStreamButton.disabled = busy;
    }

    // Build the address a viewer should open, reusing whatever scheme and port
    // this page was actually served on rather than assuming the default.
    function shareUrlFor(ip) {
        const suffix = location.port ? `:${location.port}` : "";
        return `${location.protocol}//${ip}${suffix}`;
    }

    async function getLocalIPv4Addresses() {
        const response = await fetch("/ip");
        const data = await response.json();
        return data.ips || (data.ip ? [data.ip] : []);
    }

    // The default WebRTC bitrate ceiling is far too low for a full desktop, so the
    // encoder blurs detail to stay under it. Must run after setLocalDescription,
    // which is when the encodings are populated.
    async function raiseVideoQuality(peerConnection) {
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
        if (!sender) return;

        const params = sender.getParameters();
        if (!params.encodings || !params.encodings.length) {
            console.warn("No encodings to tune yet; using browser defaults.");
            return;
        }

        params.encodings[0].maxBitrate = 8_000_000; // 8 Mbps
        params.encodings[0].maxFramerate = 30;
        // Keep pixels, sacrifice smoothness. Ignored by browsers that lack it.
        params.degradationPreference = "maintain-resolution";

        try {
            await sender.setParameters(params);
            console.log("Video sender tuned:", sender.getParameters().encodings[0]);
        } catch (error) {
            console.warn("Could not tune video sender:", error);
        }
    }

    async function handleStartSharing() {
        // Screen capture needs a secure context: https, or http on localhost only.
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            setStatus("Unavailable", "error");
            showMessage(`Screen sharing needs HTTPS or localhost. Share from the host machine at ${shareUrlFor("localhost")}, and use this page only to watch.`);
            return;
        }

        showMessage("");
        // Held until the capture picker resolves, so a double click cannot start twice.
        setControlsBusy(true);

        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: {
                    width: { ideal: 1920, max: 3840 },
                    height: { ideal: 1080, max: 2160 },
                    frameRate: { ideal: 30, max: 60 }
                },
                // Voice-call processing mangles music and video soundtracks, so
                // turn it off. Browsers that cannot capture audio (Safari,
                // Firefox) just return a video-only stream.
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                },
                // Chrome hint to offer "Share system audio" for whole screens.
                systemAudio: "include"
            });

            const audioTracks = stream.getAudioTracks();
            console.log(audioTracks.length
                ? `Capturing audio: ${audioTracks[0].label}`
                : "No audio captured (not ticked in the picker, or unsupported here).");

            // Screen content is detailed and mostly static. This tells the encoder
            // to drop frame rate rather than resolution when it runs out of
            // bitrate; without it Safari downscales and the result looks blurry.
            stream.getVideoTracks().forEach(track => {
                track.contentHint = "detail";
                const s = track.getSettings();
                console.log(`Capturing at ${s.width}x${s.height} @ ${s.frameRate}fps`);
            });

            // The sharer already hears the audio from its source; playing the
            // preview too would double it and feed back into the capture.
            videoElement.muted = true;
            videoElement.srcObject = stream;
            showStage();
            setStatus(audioTracks.length ? "Sharing with audio" : "Sharing", "live");

            const ips = await getLocalIPv4Addresses();
            shareUrlElement.textContent = ips.length
                ? ips.map(shareUrlFor).join("  or  ")
                : "No network address found for this machine.";
            copyUrlButton.hidden = !ips.length;
            document.getElementById("audioNote").hidden = audioTracks.length > 0;
            shareBar.hidden = false;

            // Sharing ends when the user stops it from the browser's own control.
            stream.getVideoTracks()[0].addEventListener("ended", () => {
                setStatus("Ready", "idle");
                showMenu();
            });

            socket.emit("broadcaster");

            socket.on("watcher", (id) => {
                const peerConnection = new RTCPeerConnection(config);
                peerConnections[id] = peerConnection;

                stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        socket.emit("candidate", id, event.candidate);
                    }
                };

                peerConnection.createOffer().then(async offer => {
                    await peerConnection.setLocalDescription(offer);
                    await raiseVideoQuality(peerConnection);
                    socket.emit("offer", id, peerConnection.localDescription);
                });
            });

            socket.on("answer", (id, answer) => {
                // The viewer can vanish between our offer and their answer.
                if (!peerConnections[id]) return;
                peerConnections[id].setRemoteDescription(new RTCSessionDescription(answer))
                    .catch(err => console.error("Failed to set remote description:", err));
            });

            socket.on("candidate", (id, candidate) => {
                if (!peerConnections[id]) return;
                peerConnections[id].addIceCandidate(new RTCIceCandidate(candidate))
                    .catch(err => console.error("Failed to add candidate:", err));
            });

            socket.on("watcher-disconnect", (id) => {
                if (peerConnections[id]) {
                    console.log("Viewer left, closing connection:", id);
                    peerConnections[id].close();
                    delete peerConnections[id];
                }
            });

        } catch (error) {
            console.error("Error starting sharing:", error);
            setStatus("Ready", "idle");
            showMessage(`Could not start sharing: ${error.message}`);
            showMenu();
        }
    }

    function handleWatchStream() {
        showMessage("");
        setControlsBusy(true);
        showStage();
        setStatus("Connecting", "connecting");

        console.log("Requesting to watch stream...");
        socket.emit("watcher");

        const peerConnection = new RTCPeerConnection(config);
        peerConnections["broadcaster"] = peerConnection;

        // The broadcaster's socket id is only known once its offer arrives, so
        // candidates found before that are queued instead of being sent nowhere.
        let broadcasterId = null;
        const pendingCandidates = [];

        peerConnection.onicecandidate = event => {
            if (!event.candidate) return;
            if (broadcasterId) {
                socket.emit("candidate", broadcasterId, event.candidate);
            } else {
                pendingCandidates.push(event.candidate);
            }
        };

        // Fires once per track (video, then audio if shared). Both belong to the
        // same stream, so only attach it once to avoid restarting playback.
        peerConnection.ontrack = event => {
            console.log(`Receiving ${event.track.kind} from broadcaster...`);
            const stream = event.streams[0];
            if (videoElement.srcObject !== stream) {
                videoElement.muted = false;
                videoElement.srcObject = stream;
            }
            playWithSound();
            if (event.track.kind === "video") setScreenshotAvailable(true);
            setStatus("Watching", "live");
        };

        peerConnection.oniceconnectionstatechange = () => {
            console.log("ICE connection state:", peerConnection.iceConnectionState);
            if (peerConnection.iceConnectionState === "failed") {
                setStatus("Connection failed", "error");
            }
        };

        socket.on("offer", async (id, offer) => {
            console.log(`Received offer from ${id}`);
            broadcasterId = id;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            // The offer only carries an audio section if the sharer captured
            // audio, so this tells the viewer which side is missing it.
            const hasAudio = peerConnection.getTransceivers()
                .some(t => t.receiver.track && t.receiver.track.kind === "audio");
            console.log(hasAudio ? "Stream includes audio." : "Stream has no audio: the sharer did not capture any.");
            if (!hasAudio) setStatus("Watching · no audio", "live");

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit("answer", id, answer);

            while (pendingCandidates.length) {
                socket.emit("candidate", id, pendingCandidates.shift());
            }
        });

        socket.on("candidate", (id, candidate) => {
            peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
                .catch(err => console.error("Failed to add candidate:", err));
        });

        // A viewer that arrived before the broadcaster gets no offer, so ask again
        // as soon as one starts sharing.
        socket.on("broadcaster", () => {
            if (!broadcasterId) {
                console.log("Broadcaster available, requesting stream again...");
                socket.emit("watcher");
            }
        });

        // Only react to the broadcaster we are actually watching leaving.
        socket.on("broadcaster-disconnect", (id) => {
            if (broadcasterId && id !== broadcasterId) return;
            setStatus("Disconnected", "error");
        });
    }

    // Autoplay policies (Safari and iOS especially) can refuse to start media
    // with sound when the Watch click was too long ago. Fall back to muted
    // playback so the picture still shows, and let the viewer opt in to sound.
    async function playWithSound() {
        try {
            await videoElement.play();
            unmuteButton.hidden = true;
        } catch (error) {
            if (error.name !== "NotAllowedError") return;
            console.warn("Autoplay with sound blocked, playing muted:", error);
            videoElement.muted = true;
            unmuteButton.hidden = false;
            videoElement.play().catch(err => console.warn("Muted playback failed:", err));
        }
    }

    function handleUnmute() {
        videoElement.muted = false;
        playWithSound();
    }

    // Grab the frame currently on screen at the stream's real resolution (not
    // the letterboxed size of the element) as a PNG blob.
    function captureFrame() {
        return new Promise((resolve, reject) => {
            const { videoWidth: width, videoHeight: height } = videoElement;
            if (!width || !height) {
                reject(new Error("No video frame to capture yet."));
                return;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(videoElement, 0, 0, width, height);
            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Could not encode frame.")), "image/png");
        });
    }

    // "done" tints the icon green for a successful capture; failures leave it.
    function flashLabel(buttons, text, restore, done) {
        buttons.forEach(b => {
            setLabel(b, text);
            b.classList.toggle("is-done", !!done);
        });
        setTimeout(() => buttons.forEach(b => {
            setLabel(b, restore);
            b.classList.remove("is-done");
        }), 1500);
    }

    async function handleScreenshot() {
        let blob;
        try {
            blob = await captureFrame();
        } catch (error) {
            console.warn(error.message);
            return;
        }

        const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `screenshot-${stamp}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);

        flashLabel(screenshotButtons, "Saved", "Screenshot", true);
    }

    // Puts the frame on the clipboard as a PNG so it can be pasted into a chat.
    async function handleCopyImage() {
        if (!canCopyImage) {
            console.warn(copyImageButtons[0].title);
            flashLabel(copyImageButtons, "Needs HTTPS", "Copy");
            return;
        }

        try {
            // Safari only accepts the write if the ClipboardItem is created
            // inside the click, so hand it the pending blob rather than awaiting.
            // Clipboard writes need a focused document; inside the pop-out that
            // is the PiP window, not this page.
            const win = pipWindow || window;
            await win.navigator.clipboard.write([new win.ClipboardItem({ "image/png": captureFrame() })]);
            flashLabel(copyImageButtons, "Copied", "Copy", true);
        } catch (error) {
            console.warn("Could not copy frame:", error);
            flashLabel(copyImageButtons, "Copy failed", "Copy");
        }
    }

    function handleFullScreen() {
        if (stageElement.requestFullscreen) {
            stageElement.requestFullscreen().catch(err => console.log("Full-screen request failed:", err));
        } else if (stageElement.webkitRequestFullscreen) {
            stageElement.webkitRequestFullscreen(); // Older Safari, iPad
        } else if (videoElement.webkitEnterFullscreen) {
            // iPhone only allows the native video player to go full screen, so
            // the overlay cannot be shown there; the header button still works.
            videoElement.webkitEnterFullscreen();
        }
    }

    // Move the whole stage (video plus overlay button) into an always-on-top
    // window, and put it back when that window closes.
    async function handlePopOut() {
        if (!canPopOut) {
            console.warn(popOutButton.title);
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await videoElement.requestPictureInPicture();
                }
            } catch (error) {
                console.warn("Could not open picture-in-picture:", error);
            }
            return;
        }

        if (pipWindow) {
            pipWindow.close();
            return;
        }

        try {
            pipWindow = await documentPictureInPicture.requestWindow({
                width: Math.round(videoElement.clientWidth / 2) || 480,
                height: Math.round(videoElement.clientHeight / 2) || 270
            });
        } catch (error) {
            console.warn("Could not open picture-in-picture window:", error);
            return;
        }

        // The new window starts blank, so give it our styles.
        const style = pipWindow.document.createElement("style");
        style.textContent = [...document.styleSheets]
            .map(sheet => [...sheet.cssRules].map(rule => rule.cssText).join("\n"))
            .join("\n");
        pipWindow.document.head.append(style);
        pipWindow.document.title = "Screen Share";

        stageElement.classList.add("is-pip");
        pipWindow.document.body.append(stageElement);
        setLabel(popOutButton, "Pop in");
        // The stage now lives in the other window, so full screen has nothing to act on.
        fullscreenButton.disabled = true;
        // Moving a media element between documents can pause it.
        videoElement.play().catch(() => {});

        pipWindow.addEventListener("pagehide", () => {
            stageElement.classList.remove("is-pip");
            document.getElementById("main").append(stageElement);
            videoElement.play().catch(() => {});
            setLabel(popOutButton, "Pop out");
            fullscreenButton.disabled = false;
            pipWindow = null;
        });
    }

    function syncFullscreenState() {
        const current = document.fullscreenElement || document.webkitFullscreenElement;
        stageElement.classList.toggle("is-fullscreen", current === stageElement);
    }

    document.addEventListener("fullscreenchange", syncFullscreenState);
    document.addEventListener("webkitfullscreenchange", syncFullscreenState);

    async function handleCopyUrl() {
        try {
            await navigator.clipboard.writeText(shareUrlElement.textContent);
            copyUrlButton.textContent = "Copied";
            setTimeout(() => { copyUrlButton.textContent = "Copy"; }, 1500);
        } catch (error) {
            // clipboard is unavailable outside a secure context; the span is
            // select-all so the address can still be copied by hand.
            console.warn("Clipboard unavailable:", error);
            copyUrlButton.textContent = "Select it";
            setTimeout(() => { copyUrlButton.textContent = "Copy"; }, 1500);
        }
    }

    startShareButton.onclick = handleStartSharing;
    watchStreamButton.onclick = handleWatchStream;
    fullscreenButton.onclick = handleFullScreen;
    copyUrlButton.onclick = handleCopyUrl;
    unmuteButton.onclick = handleUnmute;
    screenshotButton.onclick = handleScreenshot;
    fsScreenshotButton.onclick = handleScreenshot;
    copyImageButtons.forEach(b => { b.onclick = handleCopyImage; });
    popOutButton.onclick = handlePopOut;

</script>
</body>

</html>
